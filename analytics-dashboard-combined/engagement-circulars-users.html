<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engagement — Circulars · Total Users | Analytics Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/analytics-architecture.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/context-bar.css">
  <link rel="stylesheet" href="css/detail-panel.css">
  <link rel="stylesheet" href="css/engagement.css">
  <link rel="stylesheet" href="css/engagement-canonical.css">
</head>
<body data-engagement-page="circulars" data-active-tab="users">

<div data-shell="engagement-tabs"></div>

<div id="engagement-dashboard">

  <main class="engagement-canonical engagement-proposed" id="engagement-canonical">

    <header class="section-panel-header">
      <div class="hero-stat">
        <div class="narrative-header">
          <div class="narrative-header__left">
            <h1 class="narrative-header__title">Circulars</h1>
            <h2 class="narrative-header__question">How is each store's circular performing this week?</h2>
          </div>
          <div class="narrative-header__text">
            <p class="section-panel-header__subtitle">
              <span class="ep-cohort-note" id="ep-cohort-note">
                <span class="material-symbols-outlined">info</span>
                <span class="ep-cohort-note__label">Cohort:</span>
                <span class="ep-cohort-note__count">27 circulars</span>
                <span class="ep-cohort-note__sep">·</span>
                <span class="ep-cohort-note__scope">Brand</span>
                <span class="ep-cohort-note__sep">·</span>
                <span class="ep-cohort-note__period">Week 47</span>
              </span>
            </p>
            <span class="card-run-stats" id="context-date-run-stats">Ran at 27 stores · 7 days</span>
          </div>
        </div>
      </div>
    </header>

    <div class="ep-circular-info">
      <span class="ep-circular-info__item"><span class="ep-circular-info__num">27</span> circulars</span>
      <span class="ep-circular-info__sep">·</span>
      <span class="ep-circular-info__item"><span class="ep-circular-info__num">75</span> promotions</span>
      <span class="ep-circular-info__sep">·</span>
      <span class="ep-circular-info__item"><span class="ep-circular-info__num">8</span> categories</span>
    </div>

    <div class="perf-tab-pane active" data-ep-pane="users">
      <div class="hero-stat"><div class="narrative-header"><div class="narrative-header-left">
        <h2 class="narrative-header__title">Total Users</h2>
        <p class="narrative-header__question">How many unique users engaged this week, and which circulars drove them?</p>
      </div></div></div>
      <div class="ep-sub-tabs" role="tablist" aria-label="Users cuts">
        <button class="ep-sub-tab ep-sub-tab--active" data-ep-sub="store" role="tab" aria-selected="true">Users by Circular</button>
        <button class="ep-sub-tab" data-ep-sub="day" role="tab">Users by Day</button>
        <button class="ep-sub-tab" data-ep-sub="trend" role="tab">Users Time Trend</button>
      </div>
      <div class="ep-sub-pane ep-sub-pane--active" data-ep-sub-pane="store"><div class="ep-stacked-list" id="ep-users-by-store"></div></div>
      <div class="ep-sub-pane" data-ep-sub-pane="day"><div id="ep-users-by-day"></div></div>
      <div class="ep-sub-pane" data-ep-sub-pane="trend"><div id="ep-users-trend"></div></div>
    </div>

  </main>

</div><!-- /#engagement-dashboard -->

  <script src="js/engagement/shell-loader.js"></script>
  <script src="js/vendor/echarts.min.js"></script>
  <script src="js/shared/chart-colors.js"></script>
  <script src="js/data/engagement-promotions.js"></script>
  <script src="js/data/engagement-mock-data.js"></script>
  <script src="js/engagement/cache-manager.js"></script>
  <script src="js/engagement/data-service.js"></script>
  <script src="js/engagement/state-manager.js"></script>
  <script src="js/engagement/shared-core.js"></script>
  <script src="js/engagement/shared-modals.js"></script>
  <script src="js/engagement/shared-filters.js"></script>
  <script src="js/engagement/shared-perf-charts.js"></script>
  <script src="js/engagement/canonical-shell-tabs.js?v=3"></script>
  <script src="js/engagement/canonical-shell-renderers.js?v=1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.CanonicalShellRenderers) {
        window.CanonicalShellRenderers.renderDefaultPlaceholders();
        window.CanonicalShellRenderers.wireTrendRanges();
      }
    });
  </script>
  <script src="js/engagement/base-circulars.js"></script>
  <script src="js/header-slide.js"></script>
  <script src="js/engagement/engagement-page-app.js"></script>

</body>
</html>
