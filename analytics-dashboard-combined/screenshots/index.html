<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UX-846 Analytics Dashboard — IA Screenshot Sheet</title>
<style>
  :root {
    --eng: #2196F3;
    --dist: #F59E0B;
    --cmp: #10B981;
    --shell: #9CA3AF;
  }
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .meta { color: #6b7280; margin-bottom: 24px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: white; border-radius: 999px; font-size: 12px; }
  .legend span::before { content: ""; width: 12px; height: 12px; border-radius: 3px; }
  .legend .eng::before { background: var(--eng); }
  .legend .dist::before { background: var(--dist); }
  .legend .cmp::before { background: var(--cmp); }
  .legend .shell::before { background: var(--shell); }
  .page-row { background: white; border-radius: 12px; padding: 16px; margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .page-row.eng { border-left: 6px solid var(--eng); }
  .page-row.dist { border-left: 6px solid var(--dist); }
  .page-row.cmp { border-left: 6px solid var(--cmp); }
  .page-title { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
  .tab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .tab-card { display: flex; flex-direction: column; gap: 6px; cursor: zoom-in; }
  .tab-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #4b5563; }
  .tab-card img { width: 100%; height: auto; border: 1px solid #e5e7eb; border-radius: 6px; display: block; }

  /* ── Lightbox overlay ──────────────────────────────────── */
  .lb { position: fixed; inset: 0; background: rgba(15, 23, 42, .94); z-index: 100; display: none; flex-direction: column; }
  .lb.open { display: flex; }
  .lb__bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; color: white; flex: 0 0 auto; }
  .lb__bar .crumb { font-size: 13px; color: rgba(255,255,255,.65); }
  .lb__bar .title { font-size: 15px; font-weight: 600; }
  .lb__bar .counter { font-size: 12px; color: rgba(255,255,255,.6); margin-left: auto; }
  .lb__bar .close { background: transparent; border: 1px solid rgba(255,255,255,.3); color: white; font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .lb__bar .close:hover { background: rgba(255,255,255,.1); }
  .lb__stage { flex: 1; display: block; padding: 8px 80px 20px; min-height: 0; position: relative; overflow-y: auto; overflow-x: hidden; }
  .lb__img { display: block; width: 100%; height: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); border-radius: 8px; background: white; }
  .lb__stage--fit .lb__img { width: auto; max-width: 100%; max-height: calc(100vh - 220px); margin: 0 auto; }
  .lb__fitbtn { position: absolute; top: 16px; right: 80px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: white; font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; z-index: 2; }
  .lb__fitbtn:hover { background: rgba(255,255,255,.25); }
  .lb__nav { position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; z-index: 2; }
  .lb__nav:hover { background: rgba(255,255,255,.25); }
  .lb__nav:disabled { opacity: .25; cursor: default; }
  .lb__prev { left: 16px; }
  .lb__next { right: 16px; }
  .lb__thumbs { flex: 0 0 auto; display: flex; gap: 6px; padding: 8px 20px 16px; overflow-x: auto; scrollbar-width: thin; }
  .lb__thumbs button { flex: 0 0 auto; width: 80px; height: 50px; padding: 0; border: 2px solid transparent; border-radius: 4px; background: rgba(255,255,255,.05); cursor: pointer; overflow: hidden; }
  .lb__thumbs button.active { border-color: white; }
  .lb__thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb__hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,.4); pointer-events: none; }

  @media print {
    body { background: white; padding: 12px; }
    .page-row { break-inside: avoid; box-shadow: none; }
    .lb { display: none !important; }
  }
</style>
</head>
<body>
<h1>UX-846 Analytics Dashboard — IA Screenshot Sheet</h1>
<div class="meta" id="meta">Captured 2026-05-06 · click any image to open gallery · ← / → / Esc keyboard nav</div>
<div class="legend">
  <span class="eng">Engagement</span>
  <span class="dist">Distribution</span>
  <span class="cmp">Compare</span>
  <span class="shell">Shell</span>
</div>

<div id="pages"></div>

<!-- Lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <div class="lb__bar">
    <div>
      <div class="crumb" id="lb-crumb"></div>
      <div class="title" id="lb-title"></div>
    </div>
    <div class="counter" id="lb-counter"></div>
    <button class="close" id="lb-close" aria-label="Close (Esc)">Close ✕</button>
  </div>
  <button class="lb__fitbtn" id="lb-fit">Fit to screen</button>
  <div class="lb__stage" id="lb-stage">
    <img class="lb__img" id="lb-img" alt="">
  </div>
  <button class="lb__nav lb__prev" id="lb-prev" aria-label="Previous (←)">‹</button>
  <button class="lb__nav lb__next" id="lb-next" aria-label="Next (→)">›</button>
  <div class="lb__thumbs" id="lb-thumbs"></div>
  <div class="lb__hint">← / → nav · Esc close · F toggle fit · scroll inside image · click thumb to seek</div>
</div>

<script>
const PAGES = [
  { file: 'engagement-promotions', label: 'Engagement › Promotions', family: 'eng',
    tabs: ['baseline','overview','sessions','sessions__store','sessions__day','sessions__trend','sessions__data','users','users__store','users__day','users__trend','users__data','duration','duration__store','duration__day','duration__trend','duration__data','cardevents','cardevents__store','cardevents__day','cardevents__trend','cardevents__data'] },
  { file: 'engagement-categories', label: 'Engagement › Categories', family: 'eng',
    tabs: ['baseline','overview','sessions','sessions__store','sessions__day','sessions__trend','users','users__store','users__day','users__trend','duration','duration__store','duration__day','duration__trend','cardevents','cardevents__store','cardevents__day','cardevents__trend'] },
  { file: 'engagement-circulars', label: 'Engagement › Circulars', family: 'eng',
    tabs: ['baseline','overview','sessions','sessions__store','sessions__day','sessions__trend','users','users__store','users__day','users__trend','duration','duration__store','duration__day','duration__trend','cardevents','cardevents__store','cardevents__day','cardevents__trend'] },
  { file: 'engagement-grid', label: 'Engagement › Explore (Grid)', family: 'eng',
    tabs: ['baseline','overview','sessions','sessions__store','sessions__day','sessions__trend','sessions__data','users','users__store','users__day','users__trend','users__data','duration','duration__store','duration__day','duration__trend','duration__data','cardevents','cardevents__store','cardevents__day','cardevents__trend','cardevents__data'] },
  { file: 'engagement-compare', label: 'Engagement › Compare', family: 'cmp', tabs: ['baseline'] },
  { file: 'distribution-visitation', label: 'Distribution › Observed Store Visits', family: 'dist',
    tabs: ['baseline','overview','store','store__view-bar','store__view-data','store__view-trend','creative','day'] },
  { file: 'distribution-media', label: 'Distribution › Media Buy', family: 'dist',
    tabs: ['baseline','overview','store','creative','trend','data','mv-overview','mv-store','mv-trendovertime'] },
  { file: 'distribution-traffic', label: 'Distribution › Traffic Share', family: 'dist',
    tabs: ['baseline','overview','compare','trend','data'] },
];

// Build flat sequence (used by gallery)
const SEQ = [];
for (const p of PAGES) {
  for (const t of p.tabs) {
    SEQ.push({ src: p.file + '__' + t + '.png', tab: t, page: p.label, family: p.family });
  }
}

// Build contact sheet
const root = document.getElementById('pages');
for (const p of PAGES) {
  const row = document.createElement('div');
  row.className = 'page-row ' + p.family;
  row.innerHTML = '<h2 class="page-title">' + p.label + '</h2><div class="tab-grid"></div>';
  const grid = row.querySelector('.tab-grid');
  for (const t of p.tabs) {
    const card = document.createElement('div');
    card.className = 'tab-card';
    const src = p.file + '__' + t + '.png';
    card.dataset.src = src;
    card.innerHTML = '<div class="label">' + t + '</div><img loading="lazy" src="' + src + '" alt="' + p.file + ' / ' + t + '">';
    grid.appendChild(card);
  }
  root.appendChild(row);
}
document.getElementById('meta').textContent = 'Captured 2026-05-06 · ' + SEQ.length + ' screenshots · click any image to open gallery · ← / → / Esc keyboard nav';

// ── Lightbox ──────────────────────────────────────────────
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbCrumb = document.getElementById('lb-crumb');
const lbTitle = document.getElementById('lb-title');
const lbCounter = document.getElementById('lb-counter');
const lbPrev = document.getElementById('lb-prev');
const lbNext = document.getElementById('lb-next');
const lbClose = document.getElementById('lb-close');
const lbThumbs = document.getElementById('lb-thumbs');
let idx = 0;
let thumbsBuilt = false;

function buildThumbs() {
  if (thumbsBuilt) return;
  for (let i = 0; i < SEQ.length; i++) {
    const b = document.createElement('button');
    b.dataset.i = i;
    b.title = SEQ[i].page + ' — ' + SEQ[i].tab;
    b.innerHTML = '<img loading="lazy" src="' + SEQ[i].src + '" alt="">';
    lbThumbs.appendChild(b);
  }
  lbThumbs.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (btn) seek(parseInt(btn.dataset.i, 10));
  });
  thumbsBuilt = true;
}

function open(i) {
  buildThumbs();
  seek(i);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  const st = document.getElementById('lb-stage'); if (st) st.scrollTop = 0;
}
const lbStage = document.getElementById('lb-stage');
const lbFit = document.getElementById('lb-fit');
let fitMode = 'wide';
function applyFit() {
  if (fitMode === 'fit') { lbStage.classList.add('lb__stage--fit'); lbFit.textContent = 'Full width'; }
  else { lbStage.classList.remove('lb__stage--fit'); lbFit.textContent = 'Fit to screen'; }
}
lbFit.addEventListener('click', () => { fitMode = fitMode === 'wide' ? 'fit' : 'wide'; applyFit(); });
function close() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
function seek(i) {
  if (i < 0) i = 0;
  if (i >= SEQ.length) i = SEQ.length - 1;
  idx = i;
  const s = SEQ[idx];
  lbImg.src = s.src;
  lbImg.alt = s.page + ' — ' + s.tab;
  lbCrumb.textContent = s.page;
  lbTitle.textContent = s.tab;
  lbCounter.textContent = (idx + 1) + ' / ' + SEQ.length;
  lbPrev.disabled = idx === 0;
  lbNext.disabled = idx === SEQ.length - 1;
  // scroll active thumb into view
  const active = lbThumbs.querySelector('button.active');
  if (active) active.classList.remove('active');
  const next = lbThumbs.querySelector('button[data-i="' + idx + '"]');
  if (next) {
    next.classList.add('active');
    next.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  const st = document.getElementById('lb-stage'); if (st) st.scrollTop = 0;
}

// Open from contact sheet
document.addEventListener('click', e => {
  const card = e.target.closest('.tab-card');
  if (!card) return;
  const src = card.dataset.src;
  const i = SEQ.findIndex(s => s.src === src);
  if (i >= 0) open(i);
});

lbPrev.addEventListener('click', () => seek(idx - 1));
lbNext.addEventListener('click', () => seek(idx + 1));
lbClose.addEventListener('click', close);
lb.addEventListener('click', e => {
  // Close on backdrop click — anywhere outside image, nav buttons, thumbs, bar buttons
  if (e.target.closest('.lb__img, .lb__nav, .lb__thumbs, .lb__bar button, .lb__bar .title, .lb__bar .crumb, .lb__bar .counter')) return;
  close();
});

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  else if (e.key === 'ArrowLeft') seek(idx - 1);
  else if (e.key === 'ArrowRight') seek(idx + 1);
  else if (e.key === 'Home') seek(0);
  else if (e.key === 'End') seek(SEQ.length - 1);
  else if (e.key === 'f' || e.key === 'F') { fitMode = fitMode === 'wide' ? 'fit' : 'wide'; applyFit(); }
});
</script>
</body>
</html>
