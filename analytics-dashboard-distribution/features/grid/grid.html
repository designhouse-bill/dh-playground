<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - Grid Inquiry</title>

  <!-- Design Tokens & Base Styles -->
  <link rel="stylesheet" href="../../shared/design-tokens.css">
  <link rel="stylesheet" href="../../shared/base.css">

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Component Styles -->
  <link rel="stylesheet" href="../../components/header/header.css">

  <!-- Feature Styles -->
  <link rel="stylesheet" href="grid.css">
</head>
<body>
  <div class="app">

    <!-- Header Component Container -->
    <div id="header-container"></div>

    <!-- Grid Layout -->
    <main class="layout layout--grid" id="grid-layout">

      <!-- Grid Full Panel -->
      <section class="panel panel--grid-full" role="main" aria-label="Data Grid">

        <!-- Grid Controls Bar -->
        <div class="grid-controls">
          <div class="grid-controls__left">
            <span class="grid-controls__label">Showing</span>
            <span class="grid-controls__count" id="grid-record-count">0</span>
            <span class="grid-controls__label">records</span>
          </div>
          <div class="grid-controls__right">
            <div class="grid-columns-toggle">
              <button class="grid-columns-btn" id="grid-columns-btn" aria-label="Toggle column visibility">
                <span class="material-symbols-outlined">view_column</span>
                Columns
                <span class="material-symbols-outlined">expand_more</span>
              </button>
              <!-- Column Visibility Dropdown -->
              <div class="grid-columns-dropdown" id="grid-columns-dropdown">
                <div class="grid-columns-dropdown__header">
                  <span>Show/Hide Columns</span>
                  <button class="grid-columns-reset" id="reset-columns-btn">Reset</button>
                </div>
                <div class="grid-columns-dropdown__list" id="grid-columns-list">
                  <!-- Populated by JavaScript -->
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Grid Table Wrapper (horizontal scroll) -->
        <div class="grid-table-wrapper" id="grid-table-wrapper">
          <table class="grid-table" id="grid-data-table">
            <thead id="grid-table-head">
              <!-- Populated by JavaScript -->
            </thead>
            <tbody id="grid-table-body">
              <!-- Populated by JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Grid Footer with Pagination -->
        <div class="grid-footer">
          <div class="grid-footer__left">
            <span class="grid-footer__label">View</span>
            <select class="grid-rows-select" id="grid-rows-select">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            <span class="grid-footer__label">rows per page</span>
          </div>
          <div class="grid-footer__center">
            <div class="grid-pagination" id="grid-pagination">
              <button class="grid-pagination__btn" id="grid-prev-btn" disabled>
                <span class="material-symbols-outlined">chevron_left</span>
              </button>
              <span class="grid-pagination__info" id="grid-page-info">Page 1 of 1</span>
              <button class="grid-pagination__btn" id="grid-next-btn" disabled>
                <span class="material-symbols-outlined">chevron_right</span>
              </button>
            </div>
          </div>
          <div class="grid-footer__right">
            <span class="grid-footer__range" id="grid-range-info">1-25 of 0</span>
          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- Modals Container -->
  <div id="modals-container"></div>

  <!-- Scripts -->
  <script src="../../process/vendor/echarts.min.js"></script>
  <script src="../../shared/promotion-records-data.js"></script>
  <script src="../../shared/mock-data.js"></script>

  <!-- Core Services -->
  <script src="../../core/services/state.js"></script>
  <script src="../../core/services/component-loader.js"></script>
  <script src="../../core/utils/formatters.js"></script>

  <!-- Shared Services -->
  <script src="../../cache-manager.js"></script>
  <script src="../../data-service.js"></script>

  <!-- Components -->
  <script src="../../components/header/header.js"></script>

  <!-- Feature Script -->
  <script src="grid.js"></script>
</body>
</html>
