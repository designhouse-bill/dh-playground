<!-- Analytics Dashboard Header Component -->
<header class="header">

  <!-- Top Bar: Branding + Controls -->
  <div class="topbar">
    <div class="topbar__left">
      <div class="brand">
        <div class="logo">
          <span class="material-symbols-outlined">analytics</span>
        </div>
        <h1 class="title">Analytics Dashboard</h1>
      </div>
      <span class="topbar__separator">|</span>
      <button class="performance-dropdown" id="performance-type-dropdown">
        <span class="performance-dropdown__text">Circular Performance</span>
        <span class="material-symbols-outlined">expand_more</span>
      </button>
    </div>

    <div class="view-modes">
      <!-- BASE group with sub-tabs -->
      <div class="mode-group mode-group--base active" data-mode="base">
        <button class="mode-btn mode-btn--primary active" data-mode="base" aria-label="Base view">
          <span class="material-symbols-outlined">view_list</span>
          BASE
        </button>
        <div class="mode-subtabs" role="tablist">
          <button class="subtab active" data-view="categories" role="tab" aria-selected="true">Categories</button>
          <button class="subtab" data-view="promotions" role="tab" aria-selected="false">Promotions</button>
        </div>
      </div>

      <!-- GRID standalone -->
      <button class="mode-btn mode-btn--outline" data-mode="grid" aria-label="Data grid view">
        <span class="material-symbols-outlined">table_chart</span>
        GRID
      </button>

      <!-- COMPARE standalone -->
      <button class="mode-btn mode-btn--outline" data-mode="compare" aria-label="Comparison view">
        <span class="material-symbols-outlined">compare</span>
        COMPARE
      </button>
    </div>
  </div>

  <!-- Context Row: Foundation Context + Filter Chips -->
  <div class="context-row">

    <!-- Date Range Context Card -->
    <button class="context-card context-card--date" id="date-selector" aria-label="Select date range">
      <div class="card-label">Date Range</div>
      <div class="card-row">
        <div class="card-icon">
          <span class="material-symbols-outlined">calendar_month</span>
        </div>
        <div class="card-content">
          <div class="card-value">Week 47</div>
          <div class="card-sub">Nov 18-24, 2025</div>
        </div>
        <span class="card-arrow">
          <span class="material-symbols-outlined">expand_more</span>
        </span>
      </div>
    </button>

    <!-- Entity Context Card -->
    <button class="context-card" id="entity-selector" aria-label="Select entity">
      <div class="card-label">Entity</div>
      <div class="card-row">
        <div class="card-icon card-icon--entity">
          <span class="material-symbols-outlined">corporate_fare</span>
        </div>
        <div class="card-content">
          <div class="card-breadcrumb">BRAND</div>
          <div class="card-value">Grocery Holdings Corp</div>
          <div class="card-sub">27 locations</div>
        </div>
        <span class="card-arrow">
          <span class="material-symbols-outlined">expand_more</span>
        </span>
      </div>
    </button>

    <!-- Filter Group: Inline Filter Chips -->
    <div class="filter-group">
      <div class="filter-label">Filters</div>
      <div class="filter-chips" id="filter-chips">
        <!-- Dynamic filter chips will be added here -->
        <button class="add-filter" id="add-filter-btn" aria-label="Add filter">
          <span class="material-symbols-outlined">add</span>
          Add Filter
        </button>
      </div>
    </div>

  </div>

</header>
