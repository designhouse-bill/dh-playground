<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - Categories</title>

  <!-- Design Tokens & Base Styles -->
  <link rel="stylesheet" href="../../shared/design-tokens.css">
  <link rel="stylesheet" href="../../shared/base.css">

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Component Styles -->
  <link rel="stylesheet" href="../../components/header/header.css">

  <!-- Feature Styles -->
  <link rel="stylesheet" href="categories.css">
</head>
<body>
  <div class="app">

    <!-- Header Component Container -->
    <div id="header-container"></div>

    <!-- Categories Layout -->
    <main class="layout layout--categories" id="categories-layout">

      <!-- Category Data Grid Panel -->
      <section class="panel panel--category-grid" role="main" aria-label="Categories">
        <div class="panel-header panel-header--categories">
          <div class="panel-header__left">
            <button class="panel-breadcrumb" id="panel-breadcrumb">
              <span class="breadcrumb-text">BASE > Categories</span>
              <span class="material-symbols-outlined">expand_more</span>
            </button>
            <label class="toggle-switch">
              <input type="checkbox" id="more-data-toggle">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">More Data</span>
          </div>
          <div class="panel-header__right">
            <button class="panel-action-btn" id="panel-export-btn">
              <span class="material-symbols-outlined">download</span>
              Export
            </button>
            <button class="panel-action-btn" id="panel-print-btn">
              <span class="material-symbols-outlined">print</span>
              Print
            </button>
            <button class="panel-action-btn" id="panel-share-btn">
              <span class="material-symbols-outlined">share</span>
              Share
            </button>
          </div>
        </div>
        <div class="category-data-grid" id="category-data-grid">
          <!-- Table with sortable headers populated by JavaScript -->
        </div>
      </section>

      <!-- Category Detail Panel -->
      <aside class="panel panel--right panel--collapsed" id="category-detail-panel" role="complementary" aria-label="Category details">
        <div class="panel-header">
          <h2 class="panel-title">Category Details</h2>
          <button class="panel-close" id="close-detail-btn" aria-label="Close details">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="category-detail-content" id="category-detail-content">
          <!-- Populated by JavaScript -->
        </div>
      </aside>

    </main>

  </div>

  <!-- Modals Container -->
  <div id="modals-container"></div>

  <!-- Scripts -->
  <script src="../../process/vendor/echarts.min.js"></script>
  <script src="../../shared/promotion-records-data.js"></script>
  <script src="../../shared/mock-data.js"></script>

  <!-- Core Services -->
  <script src="../../core/services/state.js"></script>
  <script src="../../core/services/component-loader.js"></script>
  <script src="../../core/utils/formatters.js"></script>

  <!-- Shared Services -->
  <script src="../../cache-manager.js"></script>
  <script src="../../data-service.js"></script>

  <!-- Components -->
  <script src="../../components/header/header.js"></script>

  <!-- Feature Script -->
  <script src="categories.js"></script>
</body>
</html>
