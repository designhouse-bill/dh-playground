<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - Promotions</title>

  <!-- Design Tokens & Base Styles -->
  <link rel="stylesheet" href="../../shared/design-tokens.css">
  <link rel="stylesheet" href="../../shared/base.css">

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Component Styles -->
  <link rel="stylesheet" href="../../components/header/header.css">

  <!-- Feature Styles -->
  <link rel="stylesheet" href="promotions.css">
</head>
<body>
  <div class="app">

    <!-- Header Component Container -->
    <div id="header-container"></div>

    <!-- Promotions Layout -->
    <main class="layout layout--promotions" id="promotions-layout">

      <!-- Left Panel: Categories List (hidden via CSS by default) -->
      <aside class="panel panel--left" role="navigation" aria-label="Categories">
        <div class="panel-header">
          <h2 class="panel-title">Categories</h2>
          <span class="panel-count" id="category-count">8</span>
        </div>
        <div class="category-list" id="category-list" role="list">
          <!-- Populated by JavaScript -->
        </div>
      </aside>

      <!-- Center Panel: Promotions Grid -->
      <section class="panel panel--center" role="main" aria-label="Promotions">
        <div class="panel-header panel-header--promotions">
          <div class="panel-header__left">
            <button class="panel-breadcrumb" id="panel-breadcrumb-promotions">
              <span class="breadcrumb-text">BASE > Promotions</span>
              <span class="material-symbols-outlined">expand_more</span>
            </button>
            <label class="toggle-switch">
              <input type="checkbox" id="card-view-toggle">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">Card View</span>
          </div>
          <div class="panel-header__right">
            <button class="panel-action-btn" id="promo-export-btn">
              <span class="material-symbols-outlined">download</span>
              Export
            </button>
            <button class="panel-action-btn" id="promo-print-btn">
              <span class="material-symbols-outlined">print</span>
              Print
            </button>
            <button class="panel-action-btn" id="promo-share-btn">
              <span class="material-symbols-outlined">share</span>
              Share
            </button>
          </div>
        </div>
        <div class="promotion-grid" id="promotion-grid" role="list" style="display: none;">
          <!-- Populated by JavaScript -->
        </div>
        <div class="promotion-table" id="promotion-table">
          <!-- Populated by JavaScript -->
        </div>
      </section>

      <!-- Right Panel: Detail View -->
      <aside class="panel panel--right panel--collapsed" id="detail-panel" role="complementary" aria-label="Promotion details">
        <div class="panel-header panel-header--detail">
          <h2 class="panel-title">Details</h2>
          <button class="panel-close" id="close-detail-btn" aria-label="Close details">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="detail-content" id="detail-content">
          <!-- Populated by JavaScript -->
        </div>
        <div class="detail-footer">
          <button class="detail-footer__btn">
            <span class="material-symbols-outlined">print</span>
            Print
          </button>
          <button class="detail-footer__btn">
            <span class="material-symbols-outlined">table_chart</span>
            Grid Inquiry
          </button>
          <button class="detail-footer__btn">
            <span class="material-symbols-outlined">compare</span>
            Compare
          </button>
        </div>
      </aside>

    </main>

  </div>

  <!-- Modals Container -->
  <div id="modals-container"></div>

  <!-- Scripts -->
  <script src="../../process/vendor/echarts.min.js"></script>
  <script src="../../shared/promotion-records-data.js"></script>
  <script src="../../shared/mock-data.js"></script>

  <!-- Core Services -->
  <script src="../../core/services/state.js"></script>
  <script src="../../core/services/component-loader.js"></script>
  <script src="../../core/utils/formatters.js"></script>

  <!-- Shared Services -->
  <script src="../../cache-manager.js"></script>
  <script src="../../data-service.js"></script>

  <!-- Components -->
  <script src="../../components/header/header.js"></script>

  <!-- Feature Script -->
  <script src="promotions.js"></script>
</body>
</html>
