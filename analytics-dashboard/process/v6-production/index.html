<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - v6 Production</title>

  <!-- Design Tokens & Base Styles -->
  <link rel="stylesheet" href="../shared/design-tokens.css">
  <link rel="stylesheet" href="../shared/base.css">

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- v6 Production Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <!-- ========================================
         VARIATION 1 HEADER: Inline Filters
         Foundation context + integrated filter chips
         ======================================== -->
    <header class="v6-header">

      <!-- Top Bar: Branding + Actions -->
      <div class="v6-topbar">
        <div class="v6-brand">
          <div class="v6-logo">
            <span class="material-symbols-outlined">analytics</span>
          </div>
          <h1 class="v6-title">Analytics Dashboard</h1>
        </div>
        <div class="v6-actions">
          <button class="v6-comparison-toggle" id="comparison-toggle" aria-label="Toggle week-over-week comparison" aria-pressed="false">
            <span class="material-symbols-outlined">trending_up</span>
            <span class="v6-comparison-toggle__text">vs. Last Week</span>
          </button>
          <button class="v6-action-btn" id="export-btn">
            <span class="material-symbols-outlined">download</span>
            Export
          </button>
          <button class="v6-action-btn" id="share-btn">
            <span class="material-symbols-outlined">share</span>
            Share
          </button>
        </div>
      </div>

      <!-- Context Row: Foundation Context + Filter Chips -->
      <div class="v6-context-row">

        <!-- Date Range Context Card -->
        <button class="v6-context-card v6-context-card--date" id="date-selector" aria-label="Select date range">
          <div class="v6-card-label">Date Range</div>
          <div class="v6-card-row">
            <div class="v6-card-icon">
              <span class="material-symbols-outlined">calendar_month</span>
            </div>
            <div class="v6-card-content">
              <div class="v6-card-value">Week 47</div>
              <div class="v6-card-sub">Nov 18-24, 2025</div>
            </div>
            <span class="v6-card-arrow">
              <span class="material-symbols-outlined">expand_more</span>
            </span>
          </div>
        </button>

        <!-- Entity Context Card -->
        <button class="v6-context-card" id="entity-selector" aria-label="Select entity">
          <div class="v6-card-label">Entity</div>
          <div class="v6-card-row">
            <div class="v6-card-icon v6-card-icon--entity">
              <span class="material-symbols-outlined">corporate_fare</span>
            </div>
            <div class="v6-card-content">
              <div class="v6-card-breadcrumb">BRAND</div>
              <div class="v6-card-value">Grocery Holdings Corp</div>
              <div class="v6-card-sub">27 locations</div>
            </div>
            <span class="v6-card-arrow">
              <span class="material-symbols-outlined">expand_more</span>
            </span>
          </div>
        </button>

        <!-- Filter Group: Inline Filter Chips -->
        <div class="v6-filter-group">
          <div class="v6-filter-label">Filters</div>
          <div class="v6-filter-chips" id="filter-chips">
            <!-- Dynamic filter chips will be added here -->
            <button class="v6-add-filter" id="add-filter-btn" aria-label="Add filter">
              <span class="material-symbols-outlined">add</span>
              Add Filter
            </button>
          </div>
        </div>

      </div>

      <!-- Control Bar: View Toggle + Search -->
      <div class="v6-control-bar">
        <div class="v6-view-search">
          <div class="v6-segment-wrapper">
            <span class="v6-segment-label">View by</span>
            <div class="v6-segment" role="tablist">
              <button class="v6-segment-btn active" data-view="categories" role="tab" aria-selected="true">
                Categories
              </button>
              <button class="v6-segment-btn" data-view="promotions" role="tab" aria-selected="false">
                Promotions
              </button>
            </div>
          </div>
          <div class="v6-search-box">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="search-input" placeholder="Search..." aria-label="Search promotions or categories">
          </div>
        </div>
        <div class="v6-view-modes">
          <button class="v6-mode-btn active" data-mode="base" aria-label="Base view">
            <span class="material-symbols-outlined">view_list</span>
            Base
          </button>
          <button class="v6-mode-btn" data-mode="grid" aria-label="Data grid view">
            <span class="material-symbols-outlined">table_chart</span>
            Grid
          </button>
          <button class="v6-mode-btn" data-mode="compare" aria-label="Comparison view">
            <span class="material-symbols-outlined">compare</span>
            Compare
          </button>
        </div>
      </div>

    </header>

    <!-- ========================================
         VIEW BY: CATEGORIES - Two-Column Layout
         Left: Category Data Grid | Right: Category Details
         ======================================== -->
    <main class="v6-layout v6-layout--categories" id="categories-layout">

      <!-- Category Data Grid Panel -->
      <section class="v6-panel v6-panel--category-grid" role="main" aria-label="Categories">
        <div class="v6-panel-header">
          <h2 class="v6-panel-title">Categories</h2>
          <span class="v6-panel-count" id="category-grid-count" aria-live="polite">8</span>
        </div>
        <div class="v6-category-data-grid" id="category-data-grid">
          <!-- Table with sortable headers populated by JavaScript -->
        </div>
      </section>

      <!-- Category Detail Panel -->
      <aside class="v6-panel v6-panel--right v6-panel--collapsed" id="category-detail-panel" role="complementary" aria-label="Category details">
        <div class="v6-panel-header">
          <h2 class="v6-panel-title">Category Details</h2>
          <button class="v6-panel-close" onclick="closeCategoryDetail()" aria-label="Close details">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="v6-category-detail-content" id="category-detail-content">
          <!-- Populated by JavaScript -->
        </div>
      </aside>

    </main>

    <!-- ========================================
         VIEW BY: PROMOTIONS - Three-Column Layout
         Left: Categories | Center: Promotions | Right: Detail
         ======================================== -->
    <main class="v6-layout v6-layout--promotions" id="promotions-layout" style="display: none;">

      <!-- Left Panel: Categories List -->
      <aside class="v6-panel v6-panel--left" role="navigation" aria-label="Categories">
        <div class="v6-panel-header">
          <h2 class="v6-panel-title">Categories</h2>
          <span class="v6-panel-count" id="category-count" aria-live="polite">8</span>
        </div>
        <div class="v6-category-list" id="category-list" role="list">
          <!-- Populated by JavaScript -->
        </div>
      </aside>

      <!-- Center Panel: Promotions Grid -->
      <section class="v6-panel v6-panel--center" role="main" aria-label="Promotions">
        <div class="v6-panel-header">
          <h2 class="v6-panel-title">Promotions</h2>
          <span class="v6-panel-count" id="promo-count" aria-live="polite">0</span>
          <div class="v6-view-toggle">
            <button class="v6-view-toggle__btn" data-promo-view="cards" aria-label="Card view">
              <span class="material-symbols-outlined">grid_view</span>
            </button>
            <button class="v6-view-toggle__btn active" data-promo-view="table" aria-label="Table view">
              <span class="material-symbols-outlined">table_rows</span>
            </button>
          </div>
        </div>
        <div class="v6-promotion-grid" id="promotion-grid" role="list" style="display: none;">
          <!-- Populated by JavaScript -->
        </div>
        <div class="v6-promotion-table" id="promotion-table">
          <!-- Populated by JavaScript -->
        </div>
      </section>

      <!-- Right Panel: Detail View (Hidden until selection) -->
      <aside class="v6-panel v6-panel--right v6-panel--collapsed" id="detail-panel" role="complementary" aria-label="Promotion details">
        <div class="v6-panel-header">
          <h2 class="v6-panel-title">Details</h2>
          <button class="v6-panel-close" aria-label="Close details">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div class="v6-detail-content" id="detail-content">
          <!-- Populated by JavaScript -->
        </div>
      </aside>

    </main>

  </div>

  <!-- ========================================
       MODALS
       ======================================== -->

  <!-- Date Range Picker Modal -->
  <div class="v6-modal-overlay" id="date-picker-modal">
    <div class="v6-modal">
      <div class="v6-modal-header">
        <div class="v6-modal-header-title">
          <span class="material-symbols-outlined">calendar_month</span>
          <h3 class="v6-modal-title">Select Date Range</h3>
        </div>
        <button class="v6-modal-close" onclick="closeDatePicker()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="v6-modal-body">
        <!-- Tabs -->
        <div class="v6-date-picker-tabs">
          <button class="v6-date-picker-tab active" data-tab="week" onclick="switchDateTab('week')">By Week</button>
          <button class="v6-date-picker-tab" data-tab="custom" onclick="switchDateTab('custom')">Custom Range</button>
        </div>

        <!-- By Week Content -->
        <div class="v6-date-tab-content active" id="week-tab-content">
          <!-- Search -->
          <div class="v6-week-search">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="week-search-input" placeholder="Search weeks..." oninput="filterWeeks(this.value)">
          </div>

          <!-- Week List -->
          <div class="v6-week-list" id="week-list">
            <!-- Populated by JavaScript -->
          </div>
        </div>

        <!-- Custom Range Content -->
        <div class="v6-date-tab-content" id="custom-tab-content">
          <div class="v6-custom-date-inputs">
            <div class="v6-date-input-group">
              <label>Start Date</label>
              <input type="date" id="custom-start-date" value="2025-11-18">
            </div>
            <div class="v6-date-input-group">
              <label>End Date</label>
              <input type="date" id="custom-end-date" value="2025-11-24">
            </div>
          </div>
        </div>
      </div>
      <div class="v6-modal-footer v6-modal-footer--right">
        <button class="v6-modal-btn v6-modal-btn--secondary" onclick="closeDatePicker()">Cancel</button>
        <button class="v6-modal-btn v6-modal-btn--primary" onclick="applyDateSelection()">Apply</button>
      </div>
    </div>
  </div>

  <!-- Entity Selector Modal -->
  <div class="v6-modal-overlay" id="entity-selector-modal">
    <div class="v6-modal v6-modal--extra-wide">
      <div class="v6-modal-header">
        <div class="v6-modal-header-title">
          <span class="material-symbols-outlined">store</span>
          <h3 class="v6-modal-title">Select Entity</h3>
        </div>
        <button class="v6-modal-close" onclick="closeEntitySelector()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="v6-modal-body v6-modal-body--no-padding">
        <!-- Tabs: Nodes / Groups -->
        <div class="v6-entity-tabs" style="padding: 0 var(--space-6);">
          <button class="v6-entity-tab active" data-tab="nodes" onclick="switchEntityTab('nodes')">
            <span class="material-symbols-outlined">account_tree</span>
            Nodes
          </button>
          <button class="v6-entity-tab" data-tab="groups" onclick="switchEntityTab('groups')">
            <span class="material-symbols-outlined">workspaces</span>
            Groups
          </button>
        </div>

        <!-- Nodes Tab Content -->
        <div class="v6-entity-tab-content active" id="nodes-tab-content">
          <!-- Search -->
          <div class="v6-entity-search" style="margin: var(--space-4) var(--space-6);">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="entity-search-input" placeholder="Search entities..." oninput="filterEntities(this.value)">
          </div>

          <!-- Tree Table -->
          <div class="v6-tree-table-container">
            <table class="v6-tree-table">
              <thead>
                <tr>
                  <th class="v6-tree-col-name">Name</th>
                  <th class="v6-tree-col-type">Type</th>
                  <th class="v6-tree-col-title">Title</th>
                  <th class="v6-tree-col-subdomain">Subdomain</th>
                  <th class="v6-tree-col-path">Path</th>
                </tr>
              </thead>
              <tbody id="entity-tree-body">
                <!-- Populated by JavaScript -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Groups Tab Content -->
        <div class="v6-entity-tab-content" id="groups-tab-content">
          <!-- Search -->
          <div class="v6-entity-search" style="margin: var(--space-4) var(--space-6);">
            <span class="material-symbols-outlined">search</span>
            <input type="text" id="group-search-input" placeholder="Search groups..." oninput="filterGroups(this.value)">
          </div>

          <!-- Groups List -->
          <div class="v6-group-list" id="group-list" style="padding: 0 var(--space-6);">
            <!-- Populated by JavaScript -->
          </div>

          <!-- Create New Group Button -->
          <div class="v6-group-actions" style="padding: var(--space-4) var(--space-6);">
            <button class="v6-create-group-btn" onclick="openCreateGroupModal()">
              <span class="material-symbols-outlined">add</span>
              Create New Group
            </button>
          </div>
        </div>
      </div>
      <div class="v6-modal-footer v6-modal-footer--right">
        <button class="v6-modal-btn v6-modal-btn--secondary" onclick="closeEntitySelector()">Cancel</button>
        <button class="v6-modal-btn v6-modal-btn--primary" onclick="applyEntitySelection()">Apply</button>
      </div>
    </div>
  </div>

  <!-- Add Filter Modal -->
  <div class="v6-modal-overlay" id="add-filter-modal">
    <div class="v6-modal">
      <div class="v6-modal-header">
        <h3 class="v6-modal-title">Add Filter</h3>
        <button class="v6-modal-close" onclick="closeFilterModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="v6-modal-body">
        <div class="v6-filter-type-select">
          <label>Filter Type</label>
          <div class="v6-filter-type-buttons">
            <button class="v6-filter-type-btn active" data-type="category" onclick="selectFilterType(this)">
              <span class="material-symbols-outlined">category</span>
              Category
            </button>
            <button class="v6-filter-type-btn" data-type="deal" onclick="selectFilterType(this)">
              <span class="material-symbols-outlined">local_offer</span>
              Deal Type
            </button>
            <button class="v6-filter-type-btn" data-type="size" onclick="selectFilterType(this)">
              <span class="material-symbols-outlined">aspect_ratio</span>
              Card Size
            </button>
          </div>
        </div>

        <div class="v6-filter-value-select active" id="category-options">
          <label>Select Category</label>
          <div class="v6-filter-options" id="category-filter-options">
            <!-- Populated by JavaScript -->
          </div>
        </div>

        <div class="v6-filter-value-select" id="deal-options">
          <label>Select Deal Type</label>
          <div class="v6-filter-options" id="deal-filter-options">
            <!-- Populated by JavaScript -->
          </div>
        </div>

        <div class="v6-filter-value-select" id="size-options">
          <label>Select Card Size</label>
          <div class="v6-filter-options" id="size-filter-options">
            <!-- Populated by JavaScript -->
          </div>
        </div>
      </div>
      <div class="v6-modal-footer">
        <button class="v6-modal-btn v6-modal-btn--secondary" onclick="closeFilterModal()">Cancel</button>
        <button class="v6-modal-btn v6-modal-btn--primary" onclick="applyFilter()">Add Filter</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../shared/promotion-records-data.js"></script>
  <script src="../shared/mock-data.js"></script>
  <script src="cache-manager.js"></script>
  <script src="data-service.js"></script>
  <script src="app.js"></script>
</body>
</html>
