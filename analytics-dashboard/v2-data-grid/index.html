<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - Data Grid View</title>

  <!-- Shared Styles -->
  <link rel="stylesheet" href="../shared/design-tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/context-bar.css">

  <!-- Version Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- Header -->
    <header class="header">
      <div class="header__brand">
        <div class="header__logo"></div>
        <span class="header__title">Circular Analytics</span>
      </div>
      <div class="header__actions">
        <button class="btn btn--secondary btn--sm">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"/>
          </svg>
          Export CSV
        </button>
        <button class="btn btn--ghost btn--sm">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"/>
          </svg>
          Share
        </button>
      </div>
    </header>

    <!-- Context Bar -->
    <div class="context-bar">
      <!-- Foundation Context -->
      <div class="foundation-context">
        <div class="foundation-context__left">
          <div class="context-selector">
            <span class="context-selector__label">Date Range</span>
            <button class="context-selector__button">
              <span class="context-selector__value">Week 47</span>
              <span class="context-selector__sub">Nov 18-24, 2025</span>
              <svg class="context-selector__icon" viewBox="0 0 12 12" fill="currentColor">
                <path d="M3 4.5L6 7.5L9 4.5"/>
              </svg>
            </button>
          </div>
          <div class="context-divider"></div>
          <div class="context-selector">
            <span class="context-selector__label">Entity</span>
            <button class="context-selector__button">
              <span class="context-selector__value">All Stores</span>
              <span class="context-selector__sub">67 locations</span>
              <svg class="context-selector__icon" viewBox="0 0 12 12" fill="currentColor">
                <path d="M3 4.5L6 7.5L9 4.5"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="foundation-context__right">
          <button class="btn btn--ghost btn--sm" id="toggle-filters">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1.5 1.5A.5.5 0 012 1h12a.5.5 0 01.5.5v2a.5.5 0 01-.128.334L10 8.692V13.5a.5.5 0 01-.342.474l-3 1A.5.5 0 016 14.5V8.692L1.628 3.834A.5.5 0 011.5 3.5v-2z"/>
            </svg>
            Filters
          </button>
          <button class="btn btn--ghost btn--sm" id="toggle-columns">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M2.5 1a1 1 0 00-1 1v1a1 1 0 001 1H5a1 1 0 001-1V2a1 1 0 00-1-1H2.5zm6.5 0a1 1 0 00-1 1v1a1 1 0 001 1h2.5a1 1 0 001-1V2a1 1 0 00-1-1H9zm-7.5 6a1 1 0 011-1H5a1 1 0 011 1v1a1 1 0 01-1 1H2.5a1 1 0 01-1-1V7zm7.5 0a1 1 0 011-1h2.5a1 1 0 011 1v1a1 1 0 01-1 1H9a1 1 0 01-1-1V7z"/>
            </svg>
            Columns
          </button>
        </div>
      </div>

      <!-- Filter Chips -->
      <div class="filter-row filter-row--empty" id="filter-row">
        <div class="filter-row__chips" id="filter-chips"></div>
        <div class="filter-row__actions">
          <button class="clear-all" id="clear-all">Clear All</button>
        </div>
      </div>

      <!-- View Tabs -->
      <div class="view-tabs">
        <button class="view-tabs__tab" data-view="base">Base View</button>
        <button class="view-tabs__tab view-tabs__tab--active" data-view="grid">Data Grid</button>
        <div class="view-tabs__spacer"></div>
        <button class="view-tabs__tab" data-view="compare">Compare</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Grid Header -->
      <div class="grid-header">
        <div class="grid-header__info">
          <h2 class="grid-header__title">All Promotions</h2>
          <span class="grid-header__count" id="row-count">-- rows</span>
        </div>
        <div class="grid-header__actions">
          <div class="grid-search">
            <svg class="grid-search__icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
            </svg>
            <input type="text" class="grid-search__input" placeholder="Search promotions...">
          </div>
          <select class="select" id="rows-per-page">
            <option value="25">25 rows</option>
            <option value="50">50 rows</option>
            <option value="100">100 rows</option>
          </select>
        </div>
      </div>

      <!-- Data Grid -->
      <div class="data-grid-container">
        <table class="data-grid">
          <thead>
            <tr>
              <th class="data-grid__th data-grid__th--checkbox">
                <input type="checkbox" id="select-all">
              </th>
              <th class="data-grid__th data-grid__th--sortable" data-sort="name">
                Promotion
                <svg class="sort-icon" viewBox="0 0 12 12" fill="currentColor">
                  <path d="M6 2L9 5H3L6 2Z M6 10L3 7H9L6 10Z"/>
                </svg>
              </th>
              <th class="data-grid__th data-grid__th--sortable" data-sort="category">Category</th>
              <th class="data-grid__th data-grid__th--sortable data-grid__th--number" data-sort="civ">CIV</th>
              <th class="data-grid__th data-grid__th--sortable data-grid__th--number" data-sort="cc">CC</th>
              <th class="data-grid__th data-grid__th--sortable data-grid__th--number" data-sort="atl">ATL</th>
              <th class="data-grid__th data-grid__th--sortable data-grid__th--number" data-sort="ctr">CTR</th>
              <th class="data-grid__th data-grid__th--sortable data-grid__th--number" data-sort="score">Score</th>
              <th class="data-grid__th data-grid__th--sortable" data-sort="percentile">Percentile</th>
              <th class="data-grid__th">Deal Type</th>
              <th class="data-grid__th">Size</th>
            </tr>
          </thead>
          <tbody id="grid-body">
            <!-- Dynamic content -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="grid-footer">
        <div class="grid-footer__selection">
          <span id="selection-count">0 selected</span>
        </div>
        <div class="pagination">
          <button class="pagination__btn" id="prev-page" disabled>Previous</button>
          <span class="pagination__info" id="page-info">Page 1 of 1</span>
          <button class="pagination__btn" id="next-page">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
