<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V5 Wide Monitor - Analytics Dashboard</title>
  <link rel="stylesheet" href="../shared/design-tokens.css">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/context-bar.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__left">
        <a href="../index.html" class="back-link">← Back</a>
        <h1 class="app-header__title">Wide Monitor View</h1>
      </div>
      <div class="app-header__right">
        <span class="version-badge">Concept 5</span>
        <span class="resolution-hint">Optimized for 1920px+</span>
      </div>
    </header>

    <!-- Foundation Context -->
    <div class="context-bar">
      <div class="context-bar__foundation">
        <div class="context-selector">
          <label class="context-selector__label">Date Range</label>
          <button class="context-selector__button">
            <span id="date-display">Week 47 • Nov 18-24, 2025</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4 6l4 4 4-4H4z"/>
            </svg>
          </button>
        </div>
        <div class="context-selector">
          <label class="context-selector__label">Entity</label>
          <button class="context-selector__button">
            <span id="entity-display">All Stores (67)</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4 6l4 4 4-4H4z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Filter Chips Row -->
    <div class="filter-chips-row" id="filter-chips-row" style="display: none;">
      <div class="filter-chips" id="filter-chips"></div>
      <button class="clear-all-btn" id="clear-filters">Clear all</button>
    </div>

    <!-- Main Layout: Three Column -->
    <main class="wide-layout">
      <!-- Left Panel: Categories -->
      <aside class="side-panel side-panel--left">
        <div class="panel-header">
          <h2 class="panel-header__title">Categories</h2>
          <span class="panel-header__count" id="category-count">8</span>
        </div>
        <div class="category-list" id="category-list">
          <!-- Populated by JS -->
        </div>
      </aside>

      <!-- Center: Promotion List -->
      <section class="center-panel">
        <div class="panel-header">
          <h2 class="panel-header__title">Promotions</h2>
          <div class="panel-header__actions">
            <input type="text" class="search-input" placeholder="Search promotions..." id="search-input">
            <span class="panel-header__count" id="promo-count">10</span>
          </div>
        </div>
        <div class="promotion-grid" id="promotion-grid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Right Panel: Always-Visible Detail -->
      <aside class="side-panel side-panel--right" id="detail-panel">
        <div class="panel-header">
          <h2 class="panel-header__title">Details</h2>
        </div>
        <div class="detail-content" id="detail-content">
          <div class="detail-empty">
            <div class="detail-empty__icon">👆</div>
            <p class="detail-empty__text">Select a promotion to view details</p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="../shared/mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
