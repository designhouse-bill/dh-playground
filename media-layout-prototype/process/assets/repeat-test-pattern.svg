<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Repeat Test Pattern - Small tile for testing background-repeat -->

  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" fill="#FFE66D"/>

  <!-- Border -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="#333" stroke-width="4"/>

  <!-- Corner dots for orientation -->
  <circle cx="15" cy="15" r="8" fill="#FF6B6B"/>
  <circle cx="85" cy="15" r="8" fill="#6BCB77"/>
  <circle cx="15" cy="85" r="8" fill="#6B9FFF"/>
  <circle cx="85" cy="85" r="8" fill="#9B59B6"/>

  <!-- Arrow pointing right (shows orientation) -->
  <polygon points="30,50 70,50 55,30 55,42 30,42 30,58 55,58 55,70" fill="#333"/>
</svg>
