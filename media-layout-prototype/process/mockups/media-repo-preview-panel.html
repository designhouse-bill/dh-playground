<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Repository Preview Panel Mockup</title>

  <!-- PrimeNG CSS -->
  <link rel="stylesheet" href="../../css/primeng-overrides.css">
  <!-- PrimeIcons -->
  <link rel="stylesheet" href="https://unpkg.com/primeicons@6.0.1/primeicons.css">

  <style>
    /* Page setup for mockup viewing */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      background: #f1f5f9;
      min-height: 100vh;
    }

    .mockup-container {
      max-width: 400px;
      margin: 0 auto;
    }

    .mockup-label {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    /* Card Pattern (PrimeNG p-card style) */
    .p-card {
      background: var(--surface-card, #ffffff);
      border: 1px solid var(--surface-border, #e5e7eb);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .p-card-header {
      padding: 16px;
      border-bottom: 1px solid var(--surface-border, #e5e7eb);
      background: var(--surface-hover, #f9fafb);
    }

    .p-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-color, #1f2937);
      margin: 0;
    }

    .p-card-body {
      padding: 16px;
    }

    /* Media Row */
    .media-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface-hover, #f3f4f6);
      border: 1px solid var(--surface-border, #e5e7eb);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .media-row:last-of-type {
      margin-bottom: 0;
    }

    .media-row__label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-color-secondary, #6b7280);
      min-width: 70px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .media-row__thumb {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      overflow: hidden;
      background: #e5e7eb;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-row__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-row__thumb i {
      color: #9ca3af;
      font-size: 18px;
    }

    .media-row__name {
      flex: 1;
      font-size: 14px;
      color: var(--text-color, #1f2937);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-row__name--none {
      color: var(--text-color-muted, #9ca3af);
      font-style: italic;
    }

    .media-row__actions {
      display: flex;
      gap: 4px;
    }

    /* Buttons */
    .p-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: all 150ms ease;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .p-button-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .p-button-secondary {
      background: var(--surface-card, #ffffff);
      border-color: var(--surface-border, #e5e7eb);
      color: var(--text-color, #1f2937);
    }

    .p-button-secondary:hover {
      background: var(--surface-hover, #f3f4f6);
      border-color: #d1d5db;
    }

    .p-button-icon-only {
      padding: 6px;
      width: 28px;
      height: 28px;
    }

    .p-button-danger-text {
      background: transparent;
      border: none;
      color: #9ca3af;
    }

    .p-button-danger-text:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    /* Divider */
    .p-divider {
      border: 0;
      border-top: 1px solid var(--surface-border, #e5e7eb);
      margin: 16px 0;
    }

    /* Navigation Link */
    .p-button-text {
      background: transparent;
      border: none;
      color: var(--primary-color, #3B82F6);
      padding: 12px 16px;
      width: 100%;
      text-align: center;
      font-weight: 500;
      font-size: 14px;
    }

    .p-button-text:hover {
      background: var(--primary-color-light, #EFF6FF);
    }
  </style>
</head>
<body>
  <div class="mockup-container">
    <div class="mockup-label">Media Repository Preview Panel Mockup</div>

    <!-- Preview Panel - Full State (Hero + Background) -->
    <div class="p-card">
      <div class="p-card-header">
        <h3 class="p-card-title">Preview Promotion</h3>
      </div>
      <div class="p-card-body">
        <!-- Hero Image Row -->
        <div class="media-row">
          <span class="media-row__label">Hero</span>
          <div class="media-row__thumb">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&h=100&fit=crop" alt="Hero image">
          </div>
          <span class="media-row__name">coca-cola-hero.jpg</span>
          <div class="media-row__actions">
            <button class="p-button p-button-secondary p-button-sm">Replace</button>
            <button class="p-button p-button-icon-only p-button-danger-text" title="Remove">
              <i class="pi pi-times"></i>
            </button>
          </div>
        </div>

        <!-- Background Image Row -->
        <div class="media-row">
          <span class="media-row__label">Background</span>
          <div class="media-row__thumb">
            <img src="https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=100&h=100&fit=crop" alt="Background image">
          </div>
          <span class="media-row__name">coca-bg.jpg</span>
          <div class="media-row__actions">
            <button class="p-button p-button-secondary p-button-sm">Replace</button>
            <button class="p-button p-button-icon-only p-button-danger-text" title="Remove">
              <i class="pi pi-times"></i>
            </button>
          </div>
        </div>

        <!-- Divider -->
        <hr class="p-divider">

        <!-- Navigation Link -->
        <button class="p-button p-button-text">
          Customize in Media Layout →
        </button>
      </div>
    </div>

    <!-- State: Hero Only (No Background) -->
    <div class="mockup-label">State: Hero Image Only (No Background)</div>

    <div class="p-card">
      <div class="p-card-header">
        <h3 class="p-card-title">Preview Promotion</h3>
      </div>
      <div class="p-card-body">
        <!-- Hero Image Row -->
        <div class="media-row">
          <span class="media-row__label">Hero</span>
          <div class="media-row__thumb">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&h=100&fit=crop" alt="Hero image">
          </div>
          <span class="media-row__name">product-shot.jpg</span>
          <div class="media-row__actions">
            <button class="p-button p-button-secondary p-button-sm">Replace</button>
            <button class="p-button p-button-icon-only p-button-danger-text" title="Remove">
              <i class="pi pi-times"></i>
            </button>
          </div>
        </div>

        <!-- Background Image Row - None -->
        <div class="media-row">
          <span class="media-row__label">Background</span>
          <div class="media-row__thumb">
            <i class="pi pi-image"></i>
          </div>
          <span class="media-row__name media-row__name--none">(none)</span>
          <div class="media-row__actions">
            <button class="p-button p-button-secondary p-button-sm">Add</button>
          </div>
        </div>

        <!-- Divider -->
        <hr class="p-divider">

        <!-- Navigation Link -->
        <button class="p-button p-button-text">
          Customize in Media Layout →
        </button>
      </div>
    </div>

    <!-- State: No Media Selected -->
    <div class="mockup-label">State: No Media Selected</div>

    <div class="p-card">
      <div class="p-card-header">
        <h3 class="p-card-title">Preview Promotion</h3>
      </div>
      <div class="p-card-body">
        <!-- Hero Image Row - None -->
        <div class="media-row">
          <span class="media-row__label">Hero</span>
          <div class="media-row__thumb">
            <i class="pi pi-image"></i>
          </div>
          <span class="media-row__name media-row__name--none">(none)</span>
          <div class="media-row__actions">
            <button class="p-button p-button-secondary p-button-sm">Add</button>
          </div>
        </div>

        <!-- Background Image Row - None -->
        <div class="media-row">
          <span class="media-row__label">Background</span>
          <div class="media-row__thumb">
            <i class="pi pi-image"></i>
          </div>
          <span class="media-row__name media-row__name--none">(none)</span>
          <div class="media-row__actions">
            <button class="p-button p-button-secondary p-button-sm">Add</button>
          </div>
        </div>

        <!-- Divider -->
        <hr class="p-divider">

        <!-- Navigation Link -->
        <button class="p-button p-button-text">
          Customize in Media Layout →
        </button>
      </div>
    </div>
  </div>
</body>
</html>
